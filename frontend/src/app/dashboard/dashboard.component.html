<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <span class="icon"></span>
            <h2>ProfeTime</h2>
        </div>

        <!-- BOTÓN FUNCIONAL -->
        <button class="btn-primary" (click)="openCreateEvent('tarea')">
      + Crear Evento
    </button>

        <nav class="menu">
            <a class="item active">Calendario</a>
            <a class="item">Examenes <span class="badge">{{ menuCounts.examenes }}</span></a>
            <a class="item">Tareas <span class="badge">{{ menuCounts.tareas }}</span></a>
            <a class="item">Reuniones <span class="badge">{{ menuCounts.reuniones }}</span></a>
            <a class="item">Compartidos</a>
        </nav>

        <div class="notifications">
            <div class="notif-header">
                <small>NOTIFICACIONES</small>
                <span class="badge-red">3</span>
            </div>

            <div *ngFor="let n of notifications" class="card" [ngClass]="getNotifClass(n.type)">
                <p class="title">{{ n.title }}</p>
                <div class="footer">
                    <small>{{ n.time }}</small>
                    <span class="pill">{{ n.badge }}</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="content">
        <header class="topbar">
            <div class="title-area">
                <h1>Enero 2026</h1>
                <div class="controls">
                    <button>&lt;</button> <button>Hoy</button> <button>&gt;</button>
                </div>
            </div>
            <div class="legend">
                <span class="dot red"></span> Examenes
                <span class="dot green"></span> Tareas
                <span class="dot purple"></span> Reuniones
            </div>
        </header>

        <div class="calendar">
            <div *ngFor="let d of weekDays" class="head">{{ d }}</div>

            <div *ngFor="let d of daysInMonth" class="cell" [class.empty]="!d.day">
                <span *ngIf="d.day" class="day-number">{{ d.day }}</span>

                <div *ngIf="d.type" class="event-marker" [ngClass]="d.type">
                    {{ d.type }}
                </div>
            </div>
        </div>
    </main>
</div>

<!-- MODAL CREATE EVENT -->
<app-create-event *ngIf="showCreateEvent" [type]="selectedType" (close)="closeCreateEvent()">
</app-create-event>
