<div class="layout">

  <aside class="sidebar">
    <h2>ProfeTime</h2>

    <button class="btn-primary" (click)="openCreateEvent()">+ Crear Evento</button>

    <nav class="menu">
      <a class="item active">Calendario</a>
      <a class="item">Exámenes <span class="badge">{{ menuCounts.examenes }}</span></a>
      <a class="item">Tareas <span class="badge">{{ menuCounts.tareas }}</span></a>
      <a class="item">Reuniones <span class="badge">{{ menuCounts.reuniones }}</span></a>
    </nav>
  </aside>

  <main class="content">

    <header class="topbar">
      <div class="title-area">
        <h1>{{ monthYearDisplay }}</h1>
        <div class="controls">
          <button (click)="changeMonth(-1)">&lt;</button>
          <button (click)="goToToday()">Hoy</button>
          <button (click)="changeMonth(1)">&gt;</button>
        </div>
      </div>

      <div class="legend">
        <span class="dot red"></span> Exámenes
        <span class="dot green"></span> Tareas
        <span class="dot purple"></span> Reuniones
      </div>
    </header>

    <div class="calendar-wrapper">
      <div class="week-header">
        <div *ngFor="let d of weekDays" class="day-name">{{ d }}</div>
      </div>

      <div class="calendar-grid">
        <div *ngFor="let d of daysInMonth"
             class="day-card"
             [class.faded]="!d.isCurrentMonth">

          <span class="day-number">{{ d.day }}</span>

          <span *ngIf="d.type"
                class="event-dot"
                [ngClass]="d.type">
          </span>

        </div>
      </div>
    </div>

  </main>
</div>

<app-create-event
  *ngIf="showCreateEvent"
  (close)="closeCreateEvent()"
  (saved)="onEventSaved()">
</app-create-event>
