<section class="notifications">
  <div class="header">
    <span class="label">NOTIFICACIONES</span>
    <span class="count">{{ data.length || 0 }}</span>
  </div>

  <div *ngIf="!data || data.length === 0" class="empty">
    No hay notificaciones
  </div>

  <div
    *ngFor="let item of data"
    class="card"
    [ngClass]="getStyleClass(item.type)"
    role="button"
    tabindex="0"
    (click)="onOpen(item)"
    (keydown.enter)="onOpen(item)"
  >
    <div class="icon">{{ getIcon(item.type) }}</div>

    <div class="content">
      <p class="title">{{ item.title }}</p>
      <small class="time">{{ item.time }}</small>
    </div>

    <div class="badge" *ngIf="item.badge">{{ item.badge }}</div>

    <button class="dismiss" type="button" title="Ocultar" (click)="onDismiss(item); $event.stopPropagation()">
      ×
    </button>
  </div>
</section>
