<div class="login-page">
  <div class="login-header">
    <img src="assets/logo.jpg" class="logo" />
    <h1>ProfeTime</h1>
  </div>

  <div class="login-card">
    <h2>Iniciar Sesión</h2>

    <!-- FORMULARIO CONECTADO -->
    <form (ngSubmit)="onLogin()">

      <input
        type="email"
        placeholder="Correo electrónico"
        [(ngModel)]="correo"
        name="correo"
        required
      />

      <input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="password"
        name="password"
        required
      />

      <button type="submit">
        Iniciar Sesión
      </button>

      <!-- MENSAJE DEL LOGIN -->
      <div *ngIf="mensaje" 
          class="mensaje" 
          [ngClass]="mensajeTipo">
        {{ mensaje }}
      </div>

    </form>

    <div class="oauth">
      <div class="divider">o</div>
      <button type="button" class="google-btn" (click)="loginWithGoogle()">
        Iniciar con Google
      </button>
      <div class="domain-hint">Solo cuentas @campuscamara.es</div>
    </div>

  </div>
</div>
