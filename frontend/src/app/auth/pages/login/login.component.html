<div class="login-page">
  <main class="login-shell" role="region" aria-label="Inicio de sesion">
    <div class="mark">
      <img src="assets/logo.jpg" class="logo" alt="Logo de ProfeTime" />
      <h1>ProfeTime</h1>
    </div>

    <p class="tagline">Agenda academica clara y conectada.</p>

    <button
      type="button"
      class="google-btn"
      (click)="loginWithGoogle()"
      [disabled]="loading"
      [attr.aria-busy]="loading"
    >
      <span class="btn-inner">
        <span class="google-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="18" height="18">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.73 1.22 9.24 3.61l6.9-6.9C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l8.03 6.24C12.5 13.5 17.83 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.5 24.5c0-1.64-.15-3.22-.43-4.75H24v9h12.64c-.54 2.9-2.16 5.36-4.6 7.03l7.08 5.5C43.6 36.98 46.5 31.22 46.5 24.5z"
            />
            <path
              fill="#FBBC05"
              d="M10.59 28.54A14.5 14.5 0 0 1 9.5 24c0-1.58.27-3.1.76-4.54l-8.03-6.24A23.93 23.93 0 0 0 0 24c0 3.86.93 7.5 2.56 10.78l8.03-6.24z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.92-2.13 15.9-5.78l-7.08-5.5c-1.97 1.33-4.5 2.12-8.82 2.12-6.17 0-11.5-4-13.41-9.54l-8.03 6.24C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
        </span>

        <span class="btn-text">{{ loading ? 'Conectando...' : 'Continuar con Google' }}</span>
        <span class="spinner" *ngIf="loading" aria-hidden="true"></span>
      </span>
    </button>

    <div *ngIf="mensaje" class="mensaje" [ngClass]="mensajeTipo" role="status">
      {{ mensaje }}
    </div>

    <p class="micro">Sesion segura con Google.</p>
  </main>
</div>
